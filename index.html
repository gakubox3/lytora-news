<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>LYTORA — SEE BEYOND THE HEADLINES</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#10243a;--line:#20364d;--text:#edf5ff;--muted:#9bb0c7;--cyan:#55d6e8;--gold:#e8c77a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#091827 55%,#07111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:26px 18px 20px;border-bottom:1px solid var(--line);background:#07111fee;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.wrap{max-width:1000px;margin:auto}.brand{font-size:29px;letter-spacing:.18em;font-weight:800;color:#fff}.tag{font-size:10px;letter-spacing:.19em;color:var(--cyan);margin-top:5px}.intro{padding:25px 18px 12px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.16em}.intro h1{font-size:clamp(25px,5vw,39px);line-height:1.2;margin:9px 0}.intro p{color:var(--muted);line-height:1.7;margin:8px 0}
.tools{display:flex;gap:9px;flex-wrap:wrap;padding:12px 18px}.tools input,.tools select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}.tools input{flex:1;min-width:190px}
.tabs{display:flex;gap:8px;overflow:auto;padding:8px 18px 15px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:99px}.tabs button.active{background:#14364a;border-color:var(--cyan);color:#fff}
.status{padding:0 18px 12px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:13px;padding:0 18px 35px}
article{background:linear-gradient(145deg,var(--panel),#0a1726);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}article .meta{font-size:11px;color:var(--cyan);letter-spacing:.04em;margin-bottom:10px}article h2{font-size:18px;line-height:1.45;margin:0 0 10px}article p{color:#b6c6d8;font-size:13px;line-height:1.65;margin:0 0 14px;overflow-wrap:anywhere}article a{color:var(--gold);font-size:13px;text-decoration:none}article a:after{content:" ↗"} .empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
footer{border-top:1px solid var(--line);padding:20px 18px 35px;color:var(--muted);font-size:11px;line-height:1.7}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">LYTORA</div><div class="tag">SEE BEYOND THE HEADLINES.</div></div></header>
<main class="wrap">
<section class="intro"><div class="eyebrow">GLOBAL NEWS · JAPAN CONNECTION</div><h1>世界を知る。<br>未来を読む。</h1><p>見出しの、その先へ。世界各地のニュースを集め、まだ知られていない地域の動きにも目を向けます。</p></section>
<div class="tools"><input id="search" type="search" placeholder="国名・キーワードで検索"><select id="region"><option value="all">すべての地域</option><option value="Africa">アフリカ</option><option value="Asia">アジア</option><option value="Middle East">中東</option><option value="Europe">ヨーロッパ</option><option value="Americas">南北アメリカ</option><option value="Oceania">オセアニア</option></select></div>
<nav class="tabs"><button class="active" data-filter="all">最新ニュース</button><button data-filter="underreported">注目されにくい地域</button></nav>
<div class="status" id="status">ニュースを読み込んでいます…</div>
<section class="grid" id="news"><div class="empty">ニュースを読み込んでいます…</div></section>
</main>
<footer class="wrap">LYTORA · SEE BEYOND THE HEADLINES.<br>記事の見出し・概要・リンクは情報源に基づきます。詳細は各配信元の記事をご確認ください。</footer>
<script>
let articles=[], currentFilter='all';
const $=id=>document.getElementById(id);
function pick(o,keys){for(const k of keys){if(o&&o[k]!=null&&o[k]!=='')return o[k]}return ''}
function normalize(raw){
 let arr=Array.isArray(raw)?raw:(raw.articles||raw.items||raw.news||[]);
 return arr.map(a=>({
  title:pick(a,['title','headline','name'])||'Untitled',
  summary:pick(a,['summary','description','snippet','content']),
  url:pick(a,['url','link','article_url']),
  country:pick(a,['country','source_country']),
  region:pick(a,['region','continent']),
  date:pick(a,['published','published_at','pubDate','date']),
  source:pick(a,['source','publisher'])
 })).filter(a=>a.title);
}
function render(){
 const q=$('search').value.trim().toLowerCase(), region=$('region').value;
 let list=articles.filter(a=>{
  const hay=[a.title,a.summary,a.country,a.region,a.source].join(' ').toLowerCase();
  const regionOK=region==='all'||String(a.region).toLowerCase().includes(region.toLowerCase());
  const qOK=!q||hay.includes(q);
  const under=currentFilter!=='underreported'||/africa|middle east|central asia|south asia|southeast asia|oceania|pacific|latin america|caribbean/i.test([a.region,a.country].join(' '));
  return regionOK&&qOK&&under;
 });
 $('news').innerHTML='';
 if(!list.length){$('news').innerHTML='<div class="empty">該当するニュースがありません。検索条件を変えてみてください。</div>';return}
 list.forEach(a=>{
  const el=document.createElement('article');
  const meta=[a.country,a.region,a.source,a.date].filter(Boolean).join(' · ');
  const m=document.createElement('div');m.className='meta';m.textContent=meta||'GLOBAL NEWS';
  const h=document.createElement('h2');h.textContent=a.title;
  const p=document.createElement('p');p.textContent=a.summary||'記事の概要は配信元でご確認ください。';
  el.append(m,h,p);
  if(a.url){const link=document.createElement('a');link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='原文を読む';el.append(link)}
  $('news').append(el);
 });
}
async function load(){
 try{
  const r=await fetch('./data/articles.json',{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  articles=normalize(await r.json());
  $('status').textContent='掲載中：'+articles.length+'件 · 配信元の記事リンクから原文を確認できます';
  render();
 }catch(e){
  $('status').textContent='ニュースデータを読み込めませんでした';
  $('news').innerHTML='<div class="empty">data/articles.json が見つからないか、読み込みに失敗しました。GitHub Actionsでニュース収集が完了しているか確認してください。</div>';
 }
}
$('search').addEventListener('input',render);$('region').addEventListener('change',render);
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()}));
load();
</script>
</body></html>
